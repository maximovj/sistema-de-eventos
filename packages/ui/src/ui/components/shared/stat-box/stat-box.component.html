<div class="stat-box">
    <div [attr.class]="'stat-icon ' + colorIcon">
        <i [attr.class]="'fas ' + faIcon"></i>
    </div>
    <div class="stat-info">
        <div class="stat-label">{{titulo}}</div>
        <div class="stat-value">{{valor}}</div>
        <div class="stat-sub">{{subtitulo}}</div>
    </div>
</div>
