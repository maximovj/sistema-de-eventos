<div class="pagination-wrapper" aria-label="Paginación">
  <div class="info">
    Mostrando <strong>{{ firstItem }}</strong> - <strong>{{ lastItem }}</strong>
    de <strong>{{ totalItems }}</strong> {{ itemLabel }}
  </div>

  <div class="pagination pagination-controls">
    <button type="button" aria-label="Primera página" [disabled]="previousDisabled" (click)="goToPage(1)">
      <i class="fas fa-angle-double-left" aria-hidden="true"></i>
    </button>
    <button type="button" aria-label="Página anterior" [disabled]="previousDisabled" (click)="goToPage(currentPage - 1)">
      <i class="fas fa-angle-left" aria-hidden="true"></i>
    </button>

    <div class="page-list" aria-label="Páginas">
      @for (page of pages; track page) {
        <button
          type="button"
          [class.active]="currentPage === page"
          [attr.aria-current]="currentPage === page ? 'page' : null"
          (click)="goToPage(page)">
          {{ page }}
        </button>
      }
    </div>

    <button type="button" aria-label="Página siguiente" [disabled]="nextDisabled" (click)="goToPage(currentPage + 1)">
      <i class="fas fa-angle-right" aria-hidden="true"></i>
    </button>
    <button type="button" aria-label="Última página" [disabled]="nextDisabled" (click)="goToPage(totalPages)">
      <i class="fas fa-angle-double-right" aria-hidden="true"></i>
    </button>

    <select class="page-size-select" [(ngModel)]="pageSize" aria-label="Elementos por página" (change)="changePageSize($event)">
      @for (option of pageSizeOptions; track option) {
        <option [ngValue]="option" [selected]="pageSize === option">{{ option }}</option>
      }
    </select>
  </div>
</div>
