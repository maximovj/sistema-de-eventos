<div class="filters-artistas">
    <div class="filters-artistas-top">
        <div class="filter-title">
            <i class="fas fa-sliders-h"></i>
            <div>
                <h4>Filtros inteligentes <small>Encuentra artistas en segundos</small></h4>
            </div>
        </div>
        <div class="filter-stats">
            <span><i class="fas fa-layer-group"></i> <strong>{{ resultados }}</strong> resultados</span>
            <span><i class="fas fa-clock"></i> <span id="filtroTiempo">Última actualización: ahora</span></span>
        </div>
    </div>

    <div class="filters-artistas-grid">
        <!-- Búsqueda -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-search"></i> Buscar</label>
            <div class="input-icon">
                <i class="fas fa-search"></i>
                <input type="text" id="filtroBusqueda" [(ngModel)]="filtros.busqueda" placeholder="Nombre, alias, país...">
            </div>
        </div>

        <!-- Estatus -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-circle"></i> Estatus</label>
            <select id="filtroEstatus" [(ngModel)]="filtros.estatus">
                <option value="">Todos los estatus</option>
                <option *ngFor="let valor of estatus" [ngValue]="valor">{{ valor }}</option>
            </select>
        </div>

        <!-- Tipo de Artista -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-music"></i> Tipo</label>
            <select id="filtroTipoArtista" [(ngModel)]="filtros.tipoArtista">
                <option value="">Cualquier tipo</option>
                <option *ngFor="let tipo of tiposArtista" [ngValue]="tipo[0]">{{ tipo[1] }}</option>
            </select>
        </div>

        <!-- Género Musical -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-compact-disc"></i> Género</label>
            <select id="filtroGenero" [(ngModel)]="filtros.generoMusical">
                <option value="">Cualquier género</option>
                <option *ngFor="let genero of generosMusicales" [ngValue]="genero[0]">{{ genero[1] }}</option>
            </select>
        </div>

        <!-- Acciones -->
        <div class="filter-artistas-group">
            <label style="visibility:hidden;">Acciones</label>
            <div class="filter-actions-modern">
                <button class="btn-filter clear" type="button" (click)="limpiarFiltros()"><i class="fas fa-undo"></i></button>
                <button class="btn-filter apply" type="button" (click)="aplicarFiltros()"><i class="fas fa-filter"></i>
                    Filtrar</button>
                <button class="btn-filter export" type="button" title="Copiar URL"><i
                        class="fas fa-link"></i></button>
            </div>
        </div>
    </div>

    <!-- Filtros activos -->
    <div class="active-filters-artistas" id="activeFilters">
        <span class="label"><i class="fas fa-tags"></i> Filtros activos:</span>
        <span *ngIf="!filtrosActivos.length" style="color: rgb(170, 170, 170); font-size: 0.75rem;">Ningún filtro
            aplicado</span>
        <span *ngFor="let filtro of filtrosActivos" class="filter-tag-modern">
            {{ filtro }}
        </span>
    </div>
</div>
