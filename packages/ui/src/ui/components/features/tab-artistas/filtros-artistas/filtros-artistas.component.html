<div class="filters-artistas">
    <div class="filters-artistas-top">
        <div class="filter-title">
            <i class="fas fa-sliders-h"></i>
            <div>
                <h4>Filtros inteligentes <small>Encuentra artistas en segundos</small></h4>
            </div>
        </div>
        <div class="filter-stats">
            <span><i class="fas fa-layer-group"></i> <strong id="resultCount">7</strong> resultados</span>
            <span><i class="fas fa-clock"></i> <span id="filtroTiempo">Última actualización: ahora</span></span>
        </div>
    </div>

    <div class="filters-artistas-grid">
        <!-- Búsqueda -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-search"></i> Buscar</label>
            <div class="input-icon">
                <i class="fas fa-search"></i>
                <input type="text" id="filtroBusqueda" placeholder="Nombre, alias, país...">
            </div>
        </div>

        <!-- Estatus -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-circle"></i> Estatus</label>
            <select id="filtroEstatus">
                <option value="">Todos los estatus</option>
                <option value="CONFIRMADO">✅ Confirmado</option>
                <option value="PENDIENTE">⏳ Pendiente</option>
                <option value="CANCELADO">❌ Cancelado</option>
            </select>
        </div>

        <!-- Tipo de Artista -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-music"></i> Tipo</label>
            <select id="filtroTipoArtista">
                <option value="">Cualquier tipo</option>
                <option value="MUSICO_CANTANTE">🎤 Músico Cantante</option>
                <option value="MUSICO_INSTRUMENTISTA">🎸 Músico Instrumentista</option>
                <option value="BANDA">🎶 Banda</option>
                <option value="DJ">🎧 DJ</option>
                <option value="OTRO">Otro</option>
            </select>
        </div>

        <!-- Género Musical -->
        <div class="filter-artistas-group">
            <label><i class="fas fa-compact-disc"></i> Género</label>
            <select id="filtroGenero">
                <option value="">Cualquier género</option>
                <option value="FUSION_LATINA">Fusión Latina</option>
                <option value="POP">Pop</option>
                <option value="ROC">Rock</option>
                <option value="JAZZ">Jazz</option>
                <option value="ELECTRONICA">Electrónica</option>
                <option value="OTRO">Otro</option>
            </select>
        </div>

        <!-- Acciones -->
        <div class="filter-artistas-group">
            <label style="visibility:hidden;">Acciones</label>
            <div class="filter-actions-modern">
                <button class="btn-filter clear" onclick="limpiarFiltros()"><i class="fas fa-undo"></i></button>
                <button class="btn-filter apply" onclick="aplicarFiltros()"><i class="fas fa-filter"></i>
                    Filtrar</button>
                <button class="btn-filter export" onclick="exportarFiltros()" title="Copiar URL"><i
                        class="fas fa-link"></i></button>
            </div>
        </div>
    </div>

    <!-- Filtros activos -->
    <div class="active-filters-artistas" id="activeFilters">
        <span class="label"><i class="fas fa-tags"></i> Filtros activos:</span>
        <span style="color: rgb(170, 170, 170); font-size: 0.75rem; display: block;" id="noFilters">Ningún filtro
            aplicado</span>
        <div id="filterTags" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
    </div>
</div>
