<div class="pagination-wrap">
    <div class="info">
                Mostrando <strong>{{ inicioMostrando }}</strong> - <strong>{{ finMostrando }}</strong> de <strong>{{ totalItems }}</strong>
    </div>
    <div class="pagination" id="paginationControls">
        <button type="button" (click)="irPagina(1)" [disabled]="paginaActual === 1 || totalPaginas === 0"><i
                class="fas fa-angle-double-left"></i></button>
        <button type="button" (click)="irPagina(paginaActual - 1)" [disabled]="paginaActual === 1 || totalPaginas === 0"><i
                class="fas fa-angle-left"></i></button>
        <div class="page-list">
            <button type="button" *ngFor="let pagina of paginas" [class.active]="pagina === paginaActual" (click)="irPagina(pagina)">{{ pagina }}</button>
        </div>
        <button type="button" (click)="irPagina(paginaActual + 1)" [disabled]="paginaActual >= totalPaginas || totalPaginas === 0"><i
                class="fas fa-angle-right"></i></button>
        <button type="button" (click)="irPagina(totalPaginas)" [disabled]="paginaActual >= totalPaginas || totalPaginas === 0"><i
                class="fas fa-angle-double-right"></i></button>
                <select [(ngModel)]="porPagina" (change)="cambiarPorPagina()">
                        <option *ngFor="let opcion of opcionesPorPagina" [ngValue]="opcion">{{ opcion }}</option>
        </select>
    </div>
</div>
