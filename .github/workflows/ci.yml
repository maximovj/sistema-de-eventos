name: CI
on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Verify toolchain
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci

      - name: Check Shared types
        run: npm run check-types --workspace=@repo/shared-types

      - name: Build Services
        run: npm run build --workspace=@repo/shared-services

      - name: Build UI
        run: npm run build --workspace=@repo/ui

      - name: Build Web
        run: npm run build --workspace=web

      - name: Check application types
        run: npx turbo run check-types --filter=web
