name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      
      - name: Check types for types, models,interfaces
        run: npm run check-types --workspace=@repo/shared-types

      - name: Build components ui
        run: npx turbo run build --filter=@repo/ui --only

      - name: Build Angular Web
        run: npx turbo run build --filter=web --only
      
      - name: Build Sever
        run: npx turbo run build --filter=server --only

      - name: Build project
        run: npx turbo build check-types 
