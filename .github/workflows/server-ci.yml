name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'

jobs:
  validate:
    name: Validate JSON Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate db.json schema
        run: |
          # Verifica que db.json es un JSON válido
          jq empty apps/server/db.json
          echo "✅ db.json is valid JSON"

      - name: Test server startup
        run: |
          set -euo pipefail
          npx turbo run start --filter=server --only > /tmp/json-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:3080 > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/json-server.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://localhost:3080 > /dev/null
          echo "✅ Server is running and responding"

          for endpoint in organizadores eventos sedes artistas actividades ventas proveedores patrocinadores gastos staff incidencias; do
            curl --fail --silent --show-error "http://localhost:3080/$endpoint" > /dev/null
            echo "✅ /$endpoint endpoint works"
          done

  lint:
    name: Lint db.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check db.json formatting
        run: |
          # Verifica que db.json está bien formateado
          jq empty apps/server/db.json
          echo "✅ db.json is properly formatted"

      - name: Check for duplicate IDs
        run: |
          # Verifica que no hay IDs duplicados en los arrays
          # (Ejemplo para gastos)
          test "$(jq '[.[] | select(type == "array")] | map(map(.id) | group_by(.) | map(select(length > 1)) | length) | add' apps/server/db.json)" -eq 0
          echo "✅ No duplicate IDs found"
