name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'         
      - 'packages/ui/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check types for types, models,interfaces
        run: npm run check-types --workspace=@repo/shared-types
      
      - name: Build components ui
        run: npx turbo run build --filter=@repo/ui --only

      - name: Build Angular Web
        run: npx turbo run build --filter=web --only
      
      - name: Build Sever
        run: npx turbo run build --filter=server --only

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/web/
