<app-tab-content
    titulo="Actividades"
    subtitulo="Administra todos las actividades"
    breadcrumbItem="Panel"
>
    @if (cargando()) {
        <ui-spinner />
    } @else {
        <ui-stats-actividades />
        <ui-filtros-actividades />
        <ui-grid-tarjetas-actividades />
        <ui-paginacion-actividades />
        
        <ui-footer-layout 
            modelo="actividades" 
            [total]="total()" 
        />
    }
</app-tab-content>
