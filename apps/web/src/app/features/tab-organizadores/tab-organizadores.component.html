<app-tab-content titulo="Gestión de Organizadores" subtitulo="Administra todos los organizadores de los eventos del sistema">
    <div breadcrumb #breadcrumb>
        <!-- PAGE HEADER -->
        <div class="actions">
            <button class="btn-outline"><i class="fas fa-download"></i> Exportar</button>
            <button class="btn-primary" (click)="crearOrganizador()">
                <i class="fas fa-plus-circle"></i> Nuevo evento
            </button>
        </div>
    </div>
    
    @if(cargando()){
        <ui-spinner size="medium" align="start" />
    } @else {
        <!-- STATS -->
        <div class="stats-panel">
            <ui-stat-box
                titulo="Empresas"
                [valor]="totalEmpresas()"
                colorIcon="purple"
                faIcon="fa-building"/>
            <ui-stat-box
                titulo="Asociaciones"
                [valor]="totalAsociaciones()"
                colorIcon="pink"
                faIcon="fa-hand-holding-heart"/>
            <ui-stat-box
                titulo="Personas Físicas"
                [valor]="totalPersonasFisicas()"
                colorIcon="blue"
                faIcon="fa-user-tie"/>
            <ui-stat-box
                titulo="Total organizadores"
                [valor]="total()"
                colorIcon="green"
                faIcon="fa-users"/>
        </div>

        <!-- TABLA -->
        <ui-table-layout
            [empty]="datosPaginados().length === 0"
            [currentPage]="paginaActual()"
            [totalItems]="totalFiltrado()"
            [pageSize]="porPagina()"
            itemLabel="organizadores"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
            <div table-filters>
                <div class="filters-bar">
                    <div class="filter-group">
                        <i class="fas fa-search"></i>
                        <input type="text" id="filtroBusqueda" [(ngModel)]="filtroBusqueda" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por nombre, RFC, contacto...">
                    </div>
                    <div class="filter-group">
                        <i class="fas fa-tag"></i>
                        <select id="filtroTipo" [(ngModel)]="filtroTipo" (ngModelChange)="aplicarFiltros()">
                        <option value="">Todos los tipos</option>
                        <option value="EMPRESA_PRIVADA">Empresa privada</option>
                        <option value="EMPRESA_PUBLICA">Empresa pública</option>
                        <option value="ASOCIACION_CIVIL">Asociación civil</option>
                        <option value="PERSONA_FISICA">Persona física</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <i class="fas fa-clock"></i>
                        <select id="filtroAntiguedad" [(ngModel)]="filtroAntiguedad" (ngModelChange)="aplicarFiltros()">
                        <option value="">Todas las antigüedades</option>
                        <option value="5">+5 años</option>
                        <option value="10">+10 años</option>
                        <option value="15">+15 años</option>
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn-clear" (click)="limpiarFiltros()"><i class="fas fa-undo"></i> Limpiar</button>
                    </div>
                </div>
            </div>

            <thead>
                <tr>
                <th (click)="ordenarPor('nombre')" [attr.class]="thFiltro().nombre">Organizador <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                <th (click)="ordenarPor('tipo')" [attr.class]="thFiltro().tipo">Tipo <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                <th (click)="ordenarPor('contacto_nombre')" [attr.class]="thFiltro().contacto_nombre">Contacto <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                <th (click)="ordenarPor('telefono')" [attr.class]="thFiltro().telefono">Teléfono <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                <th (click)="ordenarPor('antiguedad')" [attr.class]="thFiltro().antiguedad">Antigüedad <span class="sort-icon"><i class="fas fa-sort"></i></span></th>
                <th style="text-align:center;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                @for (item of datosPaginados(); track item.id) {
                <ui-fila-organizador
                    [organizador]="item"
                    (ver)="verOrganizador($event)"
                    (editar)="editarOrganizador($event)"
                    (eliminar)="eliminarOrganizador($event)" />
                }
            </tbody>

            <div table-empty>No se encontraron organizadores</div>
        </ui-table-layout>
        
        <!-- FOOTER -->
        <div class="footer">
            <span><i class="fas fa-database"></i> &nbsp;<span>{{total()}}</span> organizadores registrados</span>
            <span>© 2026 Eventos Elite (EE) · v3.0</span>
        </div>
    }

    <ui-modal-organizador
        [isOpen]="modalAbierto"
        [mode]="modalTipo"
        [organizador]="organizadorSeleccionado"
        (close)="onCerrarModal()"
        (save)="onGuardarOrganizador($event)"
        (edit)="onActualizarOrganizador($event)"
        (delete)="onEliminarOrganizador($event)"
        (yesDelete)="onSiEliminarOrganizador($event)"
    />
</app-tab-content>
